
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Live Character Counter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Live Character Counter</h1>
        <p>Practice JavaScript and the DOM</p>
    </header>

    <main>
        <label for="note-text">Write your note:</label>
        <textarea id="note-text" maxlength="1000" placeholder="Start typing here..."></textarea>

        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>

        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Dark mode</button>
    </main>

    <footer>
        <p>Day 4 Software Engineering Practice</p>
    </footer>
</body>
</html>
